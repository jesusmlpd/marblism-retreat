<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Slussen";src:url("../fonts/Slussen-Compressed-Black.woff2") format("woff2");font-weight:900}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#fbf9f3;color:#111110;font-family:"Inter",sans-serif;padding:56px 64px;display:flex;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:center}
  .top img{height:44px}
  .kicker{font-size:22px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:#ffd400;padding:6px 14px}
  h1{font-family:"Slussen",sans-serif;font-weight:900;text-transform:uppercase;font-size:150px;line-height:.9;margin-top:52px}
  .sub{font-size:28px;font-weight:600;margin-top:18px}
  .dates{display:flex;gap:16px;margin-top:auto}
  .d{flex:1;border:3px solid #111110;background:#fff;padding:14px 20px}
  .d b{display:block;font-family:"Slussen",sans-serif;font-weight:900;text-transform:uppercase;font-size:52px;line-height:1}
  .d small{font-size:18px;font-weight:600;color:#716e66}
  .d:first-child{background:#ffd400}
  .d:first-child small{color:#111110}
</style>
</head>
<body>
  <div class="top">
    <img src="../images/marblism-logo.png" alt="">
    <span class="kicker">Team retreat · Mexico · 2027</span>
  </div>
  <h1>When can you go?</h1>
  <p class="sub">Thursday to Sunday. Tap the dates that work for you.</p>
  <div class="dates">
    <div class="d"><b>Feb 4 to 7</b><small>Thu, Fri, Sat, Sun</small></div>
    <div class="d"><b>Feb 18 to 21</b><small>Thu, Fri, Sat, Sun</small></div>
    <div class="d"><b>Mar 4 to 7</b><small>Thu, Fri, Sat, Sun</small></div>
  </div>
</body>
</html>
